<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>
  // 컴퓨터에서 이 파일을 더블클릭해서 열면, 인터넷에 올라간 최신 서해링으로 바로 넘어가요.
  // (GitHub Pages 주소로 열 때는 아무 일도 일어나지 않아요)
  if (location.protocol === "file:") location.replace("https://seohae-team6.github.io/team6-event/");
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="서해링 - 학생 참여 이벤트를 날짜별·달력으로 모아 보는 학교 게시판">
<title>서해링</title>
<meta name="theme-color" content="#061319">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23061319'/%3E%3Ccircle cx='20' cy='21' r='9' fill='%23f3b04c'/%3E%3Crect x='0' y='21' width='40' height='19' fill='%23061319'/%3E%3Cpath d='M5 25 Q 12.5 21 20 25 T 35 25' fill='none' stroke='%234fc1cf' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M9 31 Q 14.5 28 20 31 T 31 31' fill='none' stroke='%234fc1cf' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: 상단 고정 헤더(로고 | 검색 | 메뉴) + 가운데 한 줄 목록. 서해 낙조(노을빛 금색)와 바다(청록) */
:root {
  --bg: #eef4f5;
  --surface: #ffffff;
  --ink: #0f2730;
  --muted: #4f6a73;
  --line: #cfdfe2;
  --sea: #0c6878;
  --sea-ink: #ffffff;
  --sea-soft: #dcedf0;
  --sun: #d98a1c;
  --sun-soft: #fbefd9;
  --full: #b0433a;
  --full-soft: #f8e4e0;
  --night: #061319;
  --night-ink: #fff4dc;
  --display: "Gowun Batang", "Nanum Myeongjo", serif;
  --body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #09181e; --surface: #102830; --ink: #e3eff1; --muted: #93adb4; --line: #21424c;
    --sea: #4fc1cf; --sea-ink: #04191e; --sea-soft: #12343d; --sun: #f3b04c; --sun-soft: #33270f;
    --full: #ec8a7d; --full-soft: #3a1e1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #09181e; --surface: #102830; --ink: #e3eff1; --muted: #93adb4; --line: #21424c;
  --sea: #4fc1cf; --sea-ink: #04191e; --sea-soft: #12343d; --sun: #f3b04c; --sun-soft: #33270f;
  --full: #ec8a7d; --full-soft: #3a1e1a; color-scheme: dark;
}

[hidden] { display: none !important; }
html { font-size: 18px; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 1rem; line-height: 1.6;
}
h1, h2, h3, p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

/* ---------- 인트로 ---------- */
#intro {
  position: fixed; inset: 0; z-index: 100; background: var(--night);
  display: grid; place-items: center; transition: opacity .8s ease;
}
#intro canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
#intro h1 {
  position: relative; font-family: var(--display); font-weight: 700;
  font-size: clamp(4rem, 17vw, 9rem); letter-spacing: .08em; color: var(--night-ink);
  text-shadow: 0 0 18px rgba(255, 196, 92, .75), 0 0 60px rgba(255, 170, 60, .45), 0 0 120px rgba(79, 193, 207, .35);
  animation: introIn 1.1s cubic-bezier(.2, .7, .2, 1) both;
  transition: opacity 1s ease, transform 1s ease, filter 1s ease;
}
@keyframes introIn {
  from { opacity: 0; transform: translateY(14px) scale(.96); letter-spacing: .22em; filter: blur(6px); }
  to   { opacity: 1; transform: none; letter-spacing: .08em; filter: blur(0); }
}
#intro.fade h1 { opacity: 0; transform: translateY(-8px) scale(1.03); filter: blur(4px); }
#intro.gone { opacity: 0; pointer-events: none; }
/* 인트로가 걷히면 본 화면이 살짝 떠오르며 나타나요 */
body.intro-on > header, body.intro-on > main { opacity: 0; transform: translateY(10px); }
body > header, body > main { transition: opacity .8s ease .1s, transform .8s ease .1s; }

/* ---------- 헤더 ---------- */
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 10; background: var(--surface);
}
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.bar {
  max-width: 1080px; margin: 0 auto;
  padding-block: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center;
}
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); background: none; border: 0; padding: 0; }
.logo svg { width: 40px; height: 40px; flex: none; }
.logo span { font-family: var(--display); font-weight: 700; font-size: 1.7rem; letter-spacing: .04em; }
.search { position: relative; max-width: 520px; width: 100%; justify-self: center; }
.search input {
  width: 100%; box-sizing: border-box; min-height: 52px; padding: 0 52px 0 48px;
  border: 2px solid var(--line); border-radius: 999px; background: var(--bg); font-size: 1.05rem;
}
.search input:focus { border-color: var(--sea); outline: none; }
.search svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; color: var(--muted); }
.search .clear {
  position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
  width: 42px; height: 42px; border-radius: 50%; border: 0; background: transparent; font-size: 1.3rem; color: var(--muted);
}
.menu-wrap { position: relative; display: flex; align-items: center; gap: 10px; }
.admin-chip { font-size: .85rem; font-weight: 700; color: var(--sun); background: var(--sun-soft); padding: 4px 12px; border-radius: 999px; }
.menu-btn {
  min-height: 52px; padding: 0 18px; border-radius: 12px; border: 2px solid var(--line);
  background: var(--surface); font-weight: 700; font-size: 1.05rem; display: flex; align-items: center; gap: 8px;
}
.menu-btn:hover { border-color: var(--sea); }
.menu {
  position: absolute; right: 0; top: calc(100% + 8px); min-width: 230px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 12px 32px rgba(6, 19, 25, .18); padding: 8px; display: grid; gap: 4px;
}
.menu button {
  text-align: left; min-height: 52px; padding: 0 16px; border: 0; border-radius: 10px;
  background: transparent; font-size: 1.05rem; font-weight: 600;
}
.menu button:hover { background: var(--sea-soft); }
.menu .danger { color: var(--full); }

/* ---------- 본문 ---------- */
main {
  max-width: 1080px; margin: 0 auto;
  padding-block: 24px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 20px;
}
.note { font-size: .9rem; color: var(--muted); background: var(--sea-soft); border-radius: 10px; padding: 10px 14px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.tabs { display: inline-flex; background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; }
.tabs button {
  min-height: 50px; min-width: 110px; padding: 0 20px; border: 0; border-radius: 10px;
  background: transparent; font-weight: 700; font-size: 1.1rem; color: var(--muted);
}
.tabs button[aria-selected="true"] { background: var(--sea); color: var(--sea-ink); }
.btn {
  min-height: 52px; padding: 0 22px; border-radius: 12px; border: 2px solid transparent;
  font-weight: 700; font-size: 1.05rem;
}
.btn-primary { background: var(--sea); color: var(--sea-ink); }
.btn-sun { background: var(--sun); color: #1d1204; }
.btn-ghost { background: transparent; border-color: var(--line); }
.btn-danger { background: transparent; border-color: var(--full); color: var(--full); }
.btn-danger.solid { background: var(--full); color: #fff; }
.btn:disabled { opacity: .5; cursor: not-allowed; }

.result { font-size: 1rem; color: var(--muted); }
.result strong { color: var(--ink); }

#list { display: grid; gap: 22px; }
.group { display: grid; gap: 10px; }
.group-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; padding-top: 6px; }
.group-head h2 { font-size: 1.2rem; font-weight: 700; }
.group-head span { font-size: .9rem; color: var(--muted); }
.day-head { align-items: center; }
.day-head .day-add { margin-left: auto; min-height: 48px; padding: 0 18px; }
.cal-item { display: grid; gap: 8px; }
.cal-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cal-acts .btn { min-height: 48px; }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 440px), 1fr)); }

.card {
  display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 16px; align-items: center;
  text-align: left; width: 100%; padding: 14px 16px; border-radius: var(--radius);
  background: var(--surface); border: 2px solid var(--line); transition: border-color .15s, transform .15s;
}
.card:hover { border-color: var(--sea); transform: translateY(-1px); }
.when {
  display: grid; justify-items: center; gap: 0; padding: 8px 0; border-radius: 12px;
  background: var(--sea-soft); color: var(--sea); font-variant-numeric: tabular-nums;
}
.when .m { font-size: .8rem; font-weight: 600; }
.when .d { font-size: 1.7rem; font-weight: 700; line-height: 1.1; }
.when .dd { font-size: .78rem; font-weight: 700; }
.info { min-width: 0; display: grid; gap: 4px; }
.info h3 { font-size: 1.15rem; font-weight: 700; line-height: 1.4; overflow-wrap: anywhere; }
.meta { font-size: .9rem; color: var(--muted); }
.cap { display: grid; gap: 4px; }
.meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--sea); border-radius: 99px; }
.meter.hot i { background: var(--sun); }
.cap-text { font-size: .9rem; font-variant-numeric: tabular-nums; }
.cap-text b { font-weight: 700; }
.left-hot { color: var(--sun); font-weight: 700; }

.card.expired { border-style: dashed; }
.card.expired .when { background: var(--full-soft); color: var(--full); }
.warn { background: var(--sun-soft); color: var(--ink); border-left: 4px solid var(--sun); border-radius: 8px; padding: 10px 14px; font-weight: 600; margin-top: -6px; }
.pill { display: inline-block; font-size: .8rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--full-soft); color: var(--full); }

/* 달력 */
.cal { background: var(--surface); border: 2px solid var(--line); border-radius: var(--radius); padding: 14px; display: grid; gap: 12px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.cal-head h2 { font-size: 1.4rem; font-variant-numeric: tabular-nums; }
.cal-nav { display: flex; gap: 6px; }
.cal-nav button { min-height: 50px; min-width: 50px; padding: 0 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); font-weight: 700; font-size: 1.05rem; }
.cal-nav button:hover { border-color: var(--sea); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-wd { text-align: center; font-size: .9rem; font-weight: 700; color: var(--muted); padding: 2px 0; }
.cal-wd.sun, .day.sun .num { color: var(--full); }
.cal-wd.sat, .day.sat .num { color: var(--sea); }
.day {
  min-width: 0; min-height: 100px; display: flex; flex-direction: column; align-items: stretch; gap: 3px;
  padding: 6px; border-radius: 10px; border: 2px solid transparent; background: var(--bg); text-align: left;
}
.day:hover { border-color: var(--line); }
.day.out { opacity: .45; }
.day[aria-pressed="true"] { border-color: var(--sun); background: var(--sun-soft); }
.num { width: 30px; height: 30px; display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums; border-radius: 50%; }
.day.today .num { background: var(--sea); color: var(--sea-ink) !important; }
/* 이벤트가 있는 날: 칸 전체에 색을 칠해서 멀리서도 보이게 */
.day.has { background: var(--sea-soft); border-color: var(--sea); }
.day.has .num { color: var(--sea); }
.day.has-past { background: var(--full-soft); }
.day.has-past .num { color: var(--full); }
.day.has .chip:not(.full) { background: var(--surface); }
.day.has[aria-pressed="true"], .day.has-past[aria-pressed="true"] { border-color: var(--sun); background: var(--sun-soft); }
.chip {
  display: block; font-size: .78rem; line-height: 1.35; font-weight: 600; padding: 2px 6px; border-radius: 6px;
  background: var(--sea-soft); color: var(--sea); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.chip.full { background: var(--full-soft); color: var(--full); }
.more { font-size: .78rem; color: var(--muted); padding-left: 4px; }
.dots { display: none; gap: 3px; justify-content: center; flex-wrap: wrap; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--sea); }
.dots i.full { background: var(--full); }
.cal-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .85rem; color: var(--muted); }
.cal-legend span::before { content: ""; display: inline-block; width: 14px; height: 14px; border-radius: 4px; margin-right: 6px; background: var(--sea-soft); border: 2px solid var(--sea); vertical-align: middle; }
.cal-legend .lg-full::before { background: var(--full-soft); border-color: var(--full-soft); }

.expired { margin-top: 12px; padding-top: 20px; border-top: 2px dashed var(--line); display: grid; gap: 10px; }
.expired h2 { font-size: 1.3rem; }
.expired > p { color: var(--muted); font-size: .95rem; }

.empty { text-align: center; padding: 40px 16px; color: var(--muted); background: var(--surface); border: 2px dashed var(--line); border-radius: var(--radius); }
.empty strong { display: block; color: var(--ink); font-size: 1.15rem; margin-bottom: 4px; }
.connect { display: grid; justify-items: center; gap: 12px; }
.connect .btn { display: inline-flex; align-items: center; text-decoration: none; }
.connect .meta { overflow-wrap: anywhere; user-select: all; }

/* ---------- 대화상자 ---------- */
dialog {
  width: min(600px, calc(100vw - 32px)); max-height: calc(100vh - 48px); box-sizing: border-box;
  border: 0; border-radius: 18px; padding: 0; background: var(--surface); color: var(--ink);
  box-shadow: 0 24px 60px rgba(6, 19, 25, .35);
}
dialog::backdrop { background: rgba(6, 19, 25, .55); }
.qr { margin: 4px 0 0; display: grid; justify-items: center; gap: 6px; }
.qr img { width: 220px; height: 220px; image-rendering: pixelated; border-radius: 12px; border: 2px solid var(--line); background: #fff; }
.qr figcaption { font-size: .9rem; color: var(--muted); }
.dlg { padding: 24px; display: grid; gap: 18px; }
.dlg-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.dlg-head h2 { font-size: 1.45rem; line-height: 1.35; overflow-wrap: anywhere; }
.x { flex: none; width: 48px; height: 48px; border-radius: 12px; border: 0; background: var(--bg); font-size: 1.4rem; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 1rem; }
.facts dt { color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; }
.desc { white-space: pre-wrap; overflow-wrap: anywhere; }
.apply { background: var(--sun-soft); border-radius: 12px; padding: 16px; display: grid; gap: 6px; }
.apply h3 { font-size: 1rem; color: var(--sun); }
.apply p { font-size: 1.1rem; font-weight: 700; overflow-wrap: anywhere; }
.apply a { color: var(--sea); font-weight: 700; overflow-wrap: anywhere; }
.full-msg { background: var(--full-soft); color: var(--full); border-radius: 12px; padding: 12px 16px; font-weight: 600; }

.field { display: grid; gap: 6px; }
.field label { font-weight: 600; }
.field input, .field textarea {
  min-height: 52px; box-sizing: border-box; width: 100%; padding: 10px 14px;
  border: 2px solid var(--line); border-radius: 12px; background: var(--bg); font-size: 1.05rem;
}
.field textarea { min-height: 110px; resize: vertical; }
.field input:focus, .field textarea:focus { border-color: var(--sea); outline: none; }
.row2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
.err { color: var(--full); font-weight: 600; min-height: 1.6em; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }
.opt { font-weight: 400; color: var(--muted); font-size: .88rem; margin-left: 4px; }
.span-note { color: var(--sun); font-weight: 700; min-height: 1.6em; margin-top: -8px; }
.check { display: flex; align-items: center; gap: 12px; min-height: 52px; font-weight: 600; cursor: pointer; }
.check input { width: 26px; height: 26px; margin: 0; accent-color: var(--sea); flex: none; }
.span-tag { font-weight: 700; color: var(--sun); }
.pill.free { background: var(--sea-soft); color: var(--sea); }
.when .d.range { font-size: 1.1rem; line-height: 1.5; }
.code-input { text-align: center; letter-spacing: .5em; font-size: 1.6rem !important; font-weight: 700; }

/* 관리자 조절 */
.edit-row { border-top: 1px solid var(--line); padding-top: 16px; }
.adm { border: 2px solid var(--sun); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
.adm h3 { font-size: 1rem; color: var(--sun); }
.steppers { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.stepper { display: grid; gap: 6px; }
.stepper span { font-weight: 600; }
.stepper div { display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; gap: 6px; }
.stepper button { height: 52px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); font-size: 1.4rem; font-weight: 700; }
.stepper input {
  height: 52px; box-sizing: border-box; width: 100%; text-align: center; font-size: 1.2rem; font-weight: 700;
  border: 2px solid var(--line); border-radius: 12px; background: var(--surface); font-variant-numeric: tabular-nums;
}
.adm-list { display: grid; gap: 12px; }
.adm-item { display: grid; gap: 8px; }
.adm-item > h3 { font-size: 1.1rem; color: var(--ink); }

#toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(24px + env(safe-area-inset-bottom, 0px)); z-index: 200;
  background: var(--ink); color: var(--bg); padding: 14px 22px; border-radius: 12px; font-weight: 600;
  max-width: calc(100vw - 32px); box-sizing: border-box;
}

@media (max-width: 640px) {
  .bar { grid-template-columns: minmax(0, 1fr) auto; }
  .search { grid-column: 1 / -1; grid-row: 2; max-width: none; }
  .tabs { width: 100%; }
  .tabs button { flex: 1; min-width: 0; }
  .toolbar .btn { width: 100%; }
  .admin-chip { display: none; }
  .cal { padding: 10px; }
  .day { min-height: 60px; padding: 4px 2px; align-items: center; }
  .chip, .more { display: none; }
  .dots { display: flex; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
</style>
</head>
<body>

<div id="intro" aria-label="서해링">
  <canvas id="sparkle" aria-hidden="true"></canvas>
  <h1>서해링</h1>
</div>

<header>
  <div class="bar">
    <button class="logo" id="logo" type="button" aria-label="서해링 처음으로">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="22" r="10" fill="var(--sun)"/>
        <rect x="0" y="22" width="40" height="18" fill="var(--surface)"/>
        <path d="M3 25 Q 11.5 21 20 25 T 37 25" fill="none" stroke="var(--sea)" stroke-width="3" stroke-linecap="round"/>
        <path d="M7 31 Q 13.5 28 20 31 T 33 31" fill="none" stroke="var(--sea)" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <span>서해링</span>
    </button>
    <div class="search" role="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="이벤트 이름 검색" aria-label="이벤트 이름 검색" autocomplete="off">
      <button class="clear" id="qClear" type="button" aria-label="검색어 지우기" hidden>×</button>

        메뉴

<div id="toast" role="status" hidden></div>

<script>
(() => {
  "use strict";
  // 게시물을 등록·수정·삭제할 때마다 코드를 물어봐요.
  // 코드는 Firebase 관리자 계정(admin@ADMIN_EMAIL_DOMAIN)의 비밀번호라서 이 파일에 적혀 있지 않아요.
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    sget(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
    sset(k, v) { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch {} },
  };

  /* ================= 인트로 ================= */
  (function intro() {
    const box = $("intro"), cv = $("sparkle"), ctx = cv.getContext("2d");
    const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
    let w, h, dpr, parts = [], raf, alive = true, glow = 0, target = 1;
    document.body.classList.add("intro-on");
    function size() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = cv.clientWidth; h = cv.clientHeight;
      cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function gauss() { return (Math.random() + Math.random() + Math.random() - 1.5) / 1.5; }
    function spawn(fresh) {
      const near = Math.random() < 0.65;
      return {
        x: near ? w / 2 + gauss() * w * 0.32 : Math.random() * w,
        y: fresh ? (near ? h / 2 + gauss() * h * 0.28 : Math.random() * h) : h + 10,
        r: 0.8 + Math.random() * 2.6,
        vy: -(0.15 + Math.random() * 0.45), ph: Math.random() * Math.PI * 2,
        sp: 0.01 + Math.random() * 0.03, gold: Math.random() < 0.7,
      };
    }
    size(); addEventListener("resize", size);
    for (let i = 0; i < 110; i++) parts.push(spawn(true));
    function draw() {
      ctx.clearRect(0, 0, w, h);
      ctx.globalCompositeOperation = "lighter";
      glow += (target - glow) * (still ? 1 : 0.05);   // 파티클이 서서히 밝아지고, 끝날 때 서서히 사라짐
      for (const p of parts) {
        if (!still) { p.ph += p.sp; p.y += p.vy * (target ? 1 : 2.2); p.x += Math.sin(p.ph) * 0.35; }
        if (p.y < -10) Object.assign(p, spawn(false));
        const a = (0.35 + 0.65 * Math.abs(Math.sin(p.ph))) * glow;
        const R = p.r * 6;
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, R);
        const c = p.gold ? "255,200,110" : "120,220,232";
        g.addColorStop(0, `rgba(255,250,235,${a})`);
        g.addColorStop(0.2, `rgba(${c},${a * 0.8})`);
        g.addColorStop(1, `rgba(${c},0)`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, Math.PI * 2); ctx.fill();
      }
      if (alive && !still) raf = requestAnimationFrame(draw);
    }
    draw();
    let done = false;
    function finish() {
      if (done) return; done = true;
      target = 0;                                          // 파티클이 위로 흩어지며 사라짐
      box.classList.add("fade", "gone");                   // 배경이 0.8초 동안 걷힘
      document.body.classList.remove("intro-on");          // 본 화면이 떠오름
      setTimeout(() => { alive = false; cancelAnimationFrame(raf); box.hidden = true; }, 850);
    }
    setTimeout(() => box.classList.add("fade"), 1500);   // 1.5초 뒤 1초 동안 흐려짐
    setTimeout(finish, 2300);                             // 글자가 거의 사라질 때 본 화면으로 겹쳐 넘어감
    box.addEventListener("click", finish);                // 누르면 바로 건너뛰기
  })();

  /* ================= 날짜 도우미 ================= */
  const DAYS = ["일", "월", "화", "수", "목", "금", "토"];
  const today0 = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  const parse = (s) => { const [y, m, d] = String(s || "").split("-").map(Number); return y ? new Date(y, m - 1, d) : null; };
  const ymd = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  const dday = (s) => { const d = parse(s); if (!d) return ""; const n = Math.round((d - today0()) / 864e5); return n === 0 ? "오늘" : n > 0 ? `D-${n}` : "지난 일정"; };
  const longDate = (s) => { const d = parse(s); return d ? `${d.getMonth() + 1}월 ${d.getDate()}일 ${DAYS[d.getDay()]}요일` : "날짜 미정"; };
  const shortDate = (s) => { const d = parse(s); return d ? `${d.getMonth() + 1}월 ${d.getDate()}일(${DAYS[d.getDay()]})` : "날짜 미정"; };
  // 여러 날 이어지는 이벤트: date = 시작, endDate = 끝 (하루짜리는 비어 있음)
  const endOf = (e) => (e.endDate && String(e.endDate) > String(e.date) ? e.endDate : e.date);
  const spanDays = (e) => { const a = parse(e.date), b = parse(endOf(e)); return a && b ? Math.round((b - a) / 864e5) + 1 : 1; };
  const evDday = (e) => {
    const a = parse(e.date), b = parse(endOf(e)), t = today0(); if (!a) return "";
    if (b < t) return "종료";
    if (a <= t && spanDays(e) > 1) return "진행 중";
    return dday(e.date);
  };
  // 끝 날짜(하루짜리는 그날)가 지나면 '만료' → 목록 아래 '만료된 이벤트' 칸과 달력에 보여요.
  const isPast = (e) => { const b = parse(endOf(e)); return !!b && b < today0(); };
  const rangeText = (e) => spanDays(e) > 1 ? `${shortDate(e.date)} ~ ${shortDate(endOf(e))} · ${spanDays(e)}일간` : longDate(e.date);

  /* ================= 데이터 (Firebase) ================= */
  const FB = "https://www.gstatic.com/firebasejs/10.12.2/";
  let events = [], loaded = false, loadNote = "", offlineNote = "", mode = "starting";
  let fb = null, fs = null, auth = null, adminDomain = "seohaering.app";

  // 만료 = 끝 날짜(하루짜리는 그날)가 지난 이벤트 → '만료된 이벤트' 칸으로 내려가요.
  // 자동으로 지우지 않고, 코드를 넣고 '삭제'할 때까지 그대로 남아 있어요.

  // Firebase에 연결하지 못하면 이유를 보여줌
  function startOffline(note) { mode = "offline"; offlineNote = note; events = []; loaded = true; render(); }

  async function startShared() {
    let cfg;
    try { cfg = await import("./firebase-config.js"); }
    catch { return startOffline("firebase-config.js 파일을 찾지 못했어요. index.html과 같은 곳에 올렸는지 확인해 주세요."); }
    const c = cfg.firebaseConfig || {};
    if (!c.apiKey || !c.projectId || /여기에/.test(c.apiKey + c.projectId)) return startOffline("firebase-config.js에 Firebase 설정값을 아직 넣지 않았어요.");
    if (cfg.ADMIN_EMAIL_DOMAIN) adminDomain = cfg.ADMIN_EMAIL_DOMAIN;
    try {
      const [appM, fsM, authM] = await Promise.all([import(FB + "firebase-app.js"), import(FB + "firebase-firestore.js"), import(FB + "firebase-auth.js")]);
      const app = appM.initializeApp(c);
      fb = { ...fsM, ...authM }; fs = fsM.getFirestore(app); auth = authM.getAuth(app);
      // 코드 확인은 한 번 쓸 때만 유지돼요. 새로고침하거나 작업이 끝나면 바로 풀려요.
      try { await authM.setPersistence(auth, authM.inMemoryPersistence); } catch {}
    } catch { return startOffline("Firebase에 연결하지 못했어요. 인터넷 연결을 확인해 주세요."); }
    mode = "shared";
    const timer = setTimeout(() => { if (!loaded) { loadNote = "이벤트를 아직 불러오지 못했어요. 인터넷 연결을 확인해 주세요."; render(); } }, 10000);
    fb.onSnapshot(fb.collection(fs, "events"), (snap) => {
      events = snap.docs.map((x) => ({ ...x.data(), id: x.id }));
      clearTimeout(timer); loadNote = ""; loaded = true; render(); refreshOpen();
    }, (err) => {
      clearTimeout(timer); loaded = true;
      loadNote = err && err.code === "permission-denied" ? "이벤트를 읽을 권한이 없어요. Firestore 보안 규칙을 확인해 주세요." : "이벤트를 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.";
      render();
    });
  }
  const ref = (id) => fb.doc(fs, "events", id);

  const NO_RIGHT = "저장하지 못했어요. 코드를 다시 입력해 주세요.";
  const OFFLINE = "Firebase에 연결된 뒤에 저장할 수 있어요.";
  const why = (err, fallback) => (err && err.code === "permission-denied" ? NO_RIGHT : fallback);
  async function saveEvent(id, patch) {
    if (mode !== "shared") { toast(OFFLINE); return false; }
    try { await fb.updateDoc(ref(id), patch); return true; } catch (err) { toast(why(err, "저장하지 못했어요. 잠시 뒤 다시 시도해 주세요.")); return false; }
  }
  async function addEvent(data) {
    if (mode !== "shared") { toast(OFFLINE); return false; }
    try { await fb.addDoc(fb.collection(fs, "events"), data); return true; } catch (err) { toast(why(err, "등록하지 못했어요. 잠시 뒤 다시 시도해 주세요.")); return false; }
  }
  async function removeEvent(id) {
    if (mode !== "shared") { toast(OFFLINE); return false; }
    try { await fb.deleteDoc(ref(id)); return true; } catch (err) { toast(why(err, "삭제하지 못했어요. 잠시 뒤 다시 시도해 주세요.")); return false; }
  }

  /* ================= 화면 상태 ================= */
  const ui = { tab: "date", q: "", openId: null,
    calMonth: new Date(today0().getFullYear(), today0().getMonth(), 1), calDay: ymd(today0()) };

  /* ================= 목록 그리기 ================= */
  function card(e) {
    const d = parse(e.date), d2 = parse(endOf(e)), expired = isPast(e), multi = spanDays(e) > 1;
    const mLabel = !d ? "미정" : multi && d2.getMonth() !== d.getMonth() ? `${d.getMonth() + 1}~${d2.getMonth() + 1}월` : `${d.getMonth() + 1}월`;
    const dLabel = !d ? "-" : multi ? `${d.getDate()}~${d2.getDate()}` : d.getDate();
    return `<button type="button" class="card${expired ? " expired" : ""}" data-id="${esc(e.id)}">
      <div class="when"><span class="m">${mLabel}</span><span class="d${multi ? " range" : ""}">${dLabel}</span><span class="dd">${esc(evDday(e))}</span></div>
      <div class="info">
        <h3>${esc(e.title)}</h3>
        <p class="meta">${multi ? `<span class="span-tag">${spanDays(e)}일간</span> · ` : ""}${esc(e.place || "장소 미정")}${e.time ? " · " + esc(e.time) : ""}</p>
        ${expired ? `<span><span class="pill">만료</span></span>` : ""}
      </div>
    </button>`;
  }

  function render() {
    const listEl = $("list"), expEl = $("expired");
    const q = ui.q.trim().toLowerCase();
    const visible = events.filter((e) => !q || String(e.title || "").toLowerCase().includes(q));
    const open = visible.filter((e) => !isPast(e));
    const closed = visible.filter(isPast).sort((a, b) => String(endOf(b)).localeCompare(String(endOf(a))));

    if (!loaded) {
      listEl.innerHTML = `<div class="empty"><strong>이벤트를 불러오는 중이에요</strong>${esc(loadNote)}</div>`;
      $("result").textContent = ""; expEl.hidden = true; return;
    }
    if (mode === "offline") {
      $("result").textContent = ""; expEl.hidden = true;
      listEl.innerHTML = `<div class="empty connect"><strong>서해링 게시판에 연결되지 않았어요</strong>
        <p>${esc(offlineNote)}</p>
        <p class="meta">처음 설정하는 중이라면 README.md의 설정 방법을 따라 해 주세요.</p></div>`;
      return;
    }
    if (ui.tab === "cal") {
      renderCal(visible, q);
      // 달력 탭에서도 아래에 '만료된 이벤트' 칸을 보여줘요
      expEl.hidden = !closed.length;
      $("expList").innerHTML = closed.map(card).join("");
      return;
    }
    $("result").innerHTML = q
      ? `'<strong>${esc(ui.q.trim())}</strong>' 검색 결과 <strong>${visible.length}</strong>개`
      : `다가오는 이벤트 <strong>${open.length}</strong>개`;

    if (!open.length) {
      listEl.innerHTML = `<div class="empty">${q
        ? closed.length ? `<strong>'${esc(ui.q.trim())}'는 다가오는 이벤트에 없어요</strong>아래 ‘만료된 이벤트’에서 찾았어요.`
          : `<strong>'${esc(ui.q.trim())}' 이름의 이벤트가 없어요</strong>다른 낱말로 찾아보세요.`
        : events.length ? `<strong>다가오는 이벤트가 없어요</strong>새 이벤트가 올라오면 여기에 보여요.`
        : `<strong>아직 등록된 이벤트가 없어요</strong>관리자가 이벤트를 등록하면 여기에 보여요.`}${loadNote ? "<br>" + esc(loadNote) : ""}</div>`;
    } else {
      // 이미 시작해서 진행 중인 이벤트는 '오늘' 묶음에 보여줌
      const t = ymd(today0());
      const key = (e) => (String(e.date) < t && String(endOf(e)) >= t ? t : String(e.date));
      const by = new Map();
      open.slice().sort((a, b) => key(a).localeCompare(key(b))).forEach((e) => {
        const k = key(e); if (!by.has(k)) by.set(k, []); by.get(k).push(e);
      });
      listEl.innerHTML = [...by].map(([date, arr]) => `<div class="group">
        <div class="group-head"><h2>${esc(longDate(date))}</h2><span>${esc(dday(date))}</span></div>
        <div class="cards">${arr.map(card).join("")}</div></div>`).join("");
    }
    expEl.hidden = !closed.length;
    $("expList").innerHTML = closed.map(card).join("");
  }

  /* ================= 달력 ================= */
  function renderCal(visible, q) {
    const listEl = $("list");
    const y = ui.calMonth.getFullYear(), mo = ui.calMonth.getMonth();
    const byDate = new Map();
    visible.forEach((e) => {
      const a = parse(e.date); if (!a) return;
      const n = Math.min(spanDays(e), 92); // 여러 날 이벤트는 기간 안의 모든 날에 표시
      for (let k = 0; k < n; k++) {
        const s = ymd(new Date(a.getFullYear(), a.getMonth(), a.getDate() + k));
        if (!byDate.has(s)) byDate.set(s, []); byDate.get(s).push(e);
      }
    });

  /* ================= QR코드 만들기 (외부 도구 없이, 바이트 모드 · 오류 복원 M · 버전 1~10) ================= */
  const makeQR = (() => {

    const BLK = [0, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5];             // 블록 수 (M)

    const rsDivisor = (deg) => {

      for (let i = 0; i < deg; i++) {
        for (let j = 0; j < r.length; j++) { r[j] = gmul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j + 1]; }
        root = gmul(root, 2);

    };

      const r = new Array(div.length).fill(0);
      for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= gmul(c, f); }); }

    };
    const alignPos = (v, size) => {
      if (v === 1) return [];
      const n = Math.floor(v / 7) + 2, step = Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2, r = [6];
      for (let p = size - 7; r.length < n; p -= step) r.splice(1, 0, p);
      return r;
    };
    const bit = (x, i) => ((x >>> i) & 1) !== 0;

    return function (text) {
      const bytes = [...new TextEncoder().encode(text)];
      let v = 1;
      for (; v <= 10; v++) if (4 + (v < 10 ? 8 : 16) + bytes.length * 8 <= dataCodewords(v) * 8) break;
      if (v > 10) return null;
      const size = v * 4 + 17, cap = dataCodewords(v) * 8;
      // 1) 데이터 비트
      const bb = []; const put = (val, len) => { for (let i = len - 1; i >= 0; i--) bb.push((val >>> i) & 1); };
      put(4, 4); put(bytes.length, v < 10 ? 8 : 16); bytes.forEach((b) => put(b, 8));
      put(0, Math.min(4, cap - bb.length)); put(0, (8 - (bb.length % 8)) % 8);
      for (let pad = 0xec; bb.length < cap; pad ^= 0xec ^ 0x11) put(pad, 8);
      const data = []; for (let i = 0; i < bb.length; i += 8) data.push(parseInt(bb.slice(i, i + 8).join(""), 2));
      // 2) 오류 정정 코드 붙이고 섞기
      const nb = BLK[v], el = ECC[v], raw = Math.floor(rawModules(v) / 8);
      const nShort = nb - (raw % nb), shortLen = Math.floor(raw / nb), div = rsDivisor(el), blocks = [];

      const mod = Array.from({ length: size }, () => new Array(size).fill(false));
      const fn = Array.from({ length: size }, () => new Array(size).fill(false));
      const set = (x, y, d) => { mod[y][x] = d; fn[y][x] = true; };
      for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
      const finder = (cx, cy) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const x = cx + dx, y = cy + dy, d = Math.max(Math.abs(dx), Math.abs(dy));

      }));

        for (let i = 9; i < 15; i++) set(14 - i, 8, bit(b, i));
        for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(b, i));
        for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(b, i));

      };

      const inv = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
        (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
        (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0, (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0];
      const flip = (m) => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && inv[m](x, y)) mod[y][x] = !mod[y][x]; };
      const penalty = () => {
        let p = 0, dark = 0;
        for (let a = 0; a < 2; a++) for (let i = 0; i < size; i++) {

            if (cur === prev) run++; else { if (run >= 5) p += run - 2; run = 1; }

  // QR코드를 그림(PNG)으로 만들어요. 휴대폰 카메라가 잘 읽도록 다크 모드에서도 흰 바탕을 써요.
  function qrPng(text, px) {

    const n = m.length, quiet = 4, cell = Math.max(2, Math.floor(px / (n + quiet * 2)));
    const cv = document.createElement("canvas"); cv.width = cv.height = cell * (n + quiet * 2);
    const c = cv.getContext("2d"); c.fillStyle = "#ffffff"; c.fillRect(0, 0, cv.width, cv.height); c.fillStyle = "#0f2730";
    m.forEach((row, y) => row.forEach((d, x) => { if (d) c.fillRect((x + quiet) * cell, (y + quiet) * cell, cell, cell); }));
    return cv.toDataURL("image/png");
  }

  /* ================= 메뉴 / 검색 / 탭 ================= */
  const menu = $("menu"), menuBtn = $("menuBtn");
  function toggleMenu(open) { menu.hidden = !open; menuBtn.setAttribute("aria-expanded", String(open)); }
  menuBtn.addEventListener("click", () => toggleMenu(menu.hidden));
  document.addEventListener("click", (ev) => { if (!ev.target.closest(".menu-wrap")) toggleMenu(false); });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") toggleMenu(false); });
  menu.addEventListener("click", (ev) => {
    const b = ev.target.closest("[data-menu]"); if (!b) return;
    toggleMenu(false);
    if (b.dataset.menu === "share") {
      $("sMsg").textContent = "";
      if (!$("qrImg").src) $("qrImg").src = qrPng($("shareUrl").value, 440);
      $("dlgShare").showModal();
    }
  });
  $("addBtn").addEventListener("click", () => askCode("add"));
  $("qrSave").addEventListener("click", () => {
    const a = document.createElement("a");
    a.href = qrPng($("shareUrl").value, 1000); a.download = "seohaering-qr.png";
    document.body.appendChild(a); a.click(); a.remove();
    $("sMsg").textContent = "QR코드 그림을 저장했어요. 포스터나 발표 화면에 붙여 쓸 수 있어요.";
  });
  $("copyBtn").addEventListener("click", () => {
    const inp = $("shareUrl");
    const fallback = () => { inp.focus(); inp.select(); $("sMsg").textContent = "링크를 선택해 뒀어요. Ctrl+C로 복사하세요."; };
    try {
      navigator.clipboard.writeText(inp.value).then(() => { $("sMsg").textContent = "링크를 복사했어요."; }, fallback);
    } catch { fallback(); }
  });

  $("q").addEventListener("input", () => { ui.q = $("q").value; $("qClear").hidden = !ui.q; render(); });
  $("qClear").addEventListener("click", () => { $("q").value = ""; ui.q = ""; $("qClear").hidden = true; render(); $("q").focus(); });
  $("logo").addEventListener("click", () => { $("q").value = ""; ui.q = ""; $("qClear").hidden = true; setTab("date"); scrollTo({ top: 0, behavior: "smooth" }); });

  function setTab(t) {
    ui.tab = t; markTabs(); store.set("seohaering-tab", t); render();
  }
  function markTabs() {
    $("tabDate").setAttribute("aria-selected", String(ui.tab === "date"));
    $("tabCal").setAttribute("aria-selected", String(ui.tab === "cal"));
  }
  $("tabDate").addEventListener("click", () => setTab("date"));
  $("tabCal").addEventListener("click", () => setTab("cal"));

  document.addEventListener("click", (ev) => { const c = ev.target.closest(".card[data-id]"); if (c) openDetail(c.dataset.id); });

  let tt;
  function toast(msg) {
    const t = $("toast");
    // 대화상자가 열려 있으면 알림이 그 뒤에 가려지지 않게 맨 위 대화상자 안으로 옮겨요
    const host = [...document.querySelectorAll("dialog[open]")].pop() || document.body;
    if (t.parentNode !== host) host.appendChild(t);
    t.textContent = msg; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => (t.hidden = true), 2800);
  }

  /* ================= 시작 ================= */
  const savedTab = store.get("seohaering-tab");
  if (savedTab === "cal") ui.tab = "cal";
  markTabs();
  $("shareUrl").value = location.href.split("#")[0];
  render();
  startShared();
  setInterval(() => { if (loaded) render(); }, 60 * 1000);
})();
</script>
</body>
</html>
